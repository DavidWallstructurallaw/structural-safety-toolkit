[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-safety-toolkit"
version = "0.2.0.dev0"
description = "Local structural safety analysis for finite AI agent deployment models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
structural-safety = "structural_safety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structural_safety = ["examples/*.json", "templates/*.json", "integrations/*.json"]
